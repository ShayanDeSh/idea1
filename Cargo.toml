[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/models-llama",
    "crates/backend-candle",
    "crates/cli",
]
default-members = ["crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Internal crates
idea1-core = { path = "crates/core" }
idea1-models-llama = { path = "crates/models-llama" }
idea1-backend-candle = { path = "crates/backend-candle" }

# External
anyhow = "1"
candle-core = "0.11"
candle-nn = "0.11"
clap = { version = "4", features = ["derive"] }
hf-hub = { version = "0.4.2", default-features = false, features = ["ureq"] }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
safetensors = "0.8"
tempfile = "3"
